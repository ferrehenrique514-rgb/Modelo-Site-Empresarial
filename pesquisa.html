    <!--Inicio pagina Pesquisa-->
        <section class="container">
            <div class="divs" align="center">
                <h2>Pesquisa de Usuário</h2>
                Preencha o formulário abaixo.
            </div>
        </section>
        <hr>
        <section class="container">
            <form action="envia_contato.php" method="post" class="pesquisa-form">


                <!--Bloco_01-->
                <div class="form-bloco">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>


                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" placeholder="Digite sua idade" required>


                    <label for="signo">Signo:</label>
                    <select id="signo" name="signo" required>
                        <option value="" disabled selected>Selecione seu signo</option>
                        <option>Áries</option>
                        <option>Touro</option>
                        <option>Gêmeos</option>
                        <option>Câncer</option>
                        <option>Leão</option>
                        <option>Virgem</option>
                        <option>Libra</option>
                        <option>Escorpião</option>
                        <option>Sagitário</option>
                        <option>Aquário</option>
                        <option>Peixes</option>
                        <option>Capricórnio</option>
                    </select>


                    <label for="cor">Cor Preferida:</label>
                    <input type="text" id="cor" name="cor" placeholder="Ex: verde, vermelho,..." required>
                </div>


                <!--Bloco_02-->
                <div class="form-bloco">
                    <label for="time">Time de Futebol:</label>
                    <input type="text" id="time" name="time" placeholder="Seu Time do coração" required>


                    <label for="profissao">Profissão:</label>
                    <input type="text" id="profissao" name="profissao" placeholder="Ex: Professor, Engenheiro,..." required>


                    <label for="formacao">Formação:</label>
                    <input type="text" id="formacao" name="formacao" placeholder="Ex: Ensino Médio, Graduação,..." required>


                    <label for="livro">Último livro lido:</label>
                    <input type="text" id="livro" name="livro" placeholder="Ex: Autor ou Nome do livro" required>
                </div>


                <!--Bloco_03-->
                <div class="form-bloco full-width">
                    <label for="habitos">Hábitos:</label>
                    <textarea id="habitos" name="habitos" placeholder="Fale um pouco sobre seus Hábitos." rows="3" maxlength="512"></textarea>


                    <label for="hobbies">Hobbies:</label>
                    <textarea id="hobbies" name="hobbies" placeholder="Fale o que gosta de fazer nas horas livres." rows="3" maxlength="230"></textarea>
                </div>


                <!------------formulário Extra-------------------->
        <div class="form-bloco2">
            <h4>Qual país deseja conhecer?</h4>
            <fieldset class="form-bloco2">
                <legend><label>País</label></legend>


                <input type="radio" id="opcao" name="pais" checked>
                <label for="pais">Estados Unidos:</label><br>


                <input type="radio" id="opcao" name="pais">
                <label for="pais">Dinamarca:</label><br>


                <input type="radio" id="opcao" name="pais">
                <label for="pais">Egito:</label><br>


                <input type="radio" id="opcao" name="pais">
                <label for="pais">Indonesia:</label>


            </fieldset>
        </div>


        <div class="form-bloco2">
            <h4>Qual Linguagem você interessa?</h4>
            <fieldset class="form-bloco2">
                <legend><label>Linguagem</label></legend>


                <input type="checkbox" id="opcao_01" name="linguagem_01" checked>
                <label for="linguagem_01">Python:</label><br>


                <input type="checkbox" id="opcao_02" name="linguagem_02">
                <label for="linguagem_02">JavaScript:</label><br>


                <input type="checkbox" id="opcao_03" name="linguagem_03">
                <label for="linguagem_03">PHP:</label><br>


                <input type="checkbox" id="opcao_04" name="linguagem_04">
                <label for="linguagem_04">C#:</label>


            </fieldset>
        </div>
           
                <button type="reset" class="btn">Limpar</button>
                <button type="submit" class="btn">Enviar</button>
            </form>
        </section>
